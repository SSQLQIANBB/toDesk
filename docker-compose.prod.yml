services:
  backend:
    image: ${DOCKERHUB_NAMESPACE:-ssq5603151}/todesk-backend:${IMAGE_TAG:-latest}
    container_name: todesk-backend
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    volumes:
      - todesk-uploads:/app/backend-koa/uploads
    networks:
      - todesk-internal
      - shared-services

  web:
    image: ${DOCKERHUB_NAMESPACE:-ssq5603151}/todesk-web:${IMAGE_TAG:-latest}
    container_name: todesk-web
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - todesk-internal

  caddy:
    image: ${DOCKERHUB_NAMESPACE:-ssq5603151}/${CADDY_IMAGE:-todesk-caddy}:${IMAGE_TAG:-latest}
    container_name: todesk-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
      PRIVATE_FILES_DOMAIN: ${PRIVATE_FILES_DOMAIN}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - todesk-internal

  cert-sync:
    image: ${DOCKERHUB_NAMESPACE:-ssq5603151}/${CERT_SYNC_IMAGE:-todesk-cert-sync}:${IMAGE_TAG:-latest}
    container_name: todesk-cert-sync
    restart: unless-stopped
    environment:
      FILES_DOMAIN: ${FILES_DOMAIN}
      PRIVATE_FILES_DOMAIN: ${PRIVATE_FILES_DOMAIN}
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY}
      CERT_SYNC_INTERVAL_SECONDS: ${CERT_SYNC_INTERVAL_SECONDS:-21600}
      CERT_SYNC_RETRY_SECONDS: ${CERT_SYNC_RETRY_SECONDS:-300}
    depends_on:
      - caddy
    volumes:
      - caddy-data:/data:ro
      - cert-sync-state:/state
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - todesk-internal

volumes:
  todesk-uploads:
  caddy-data:
  caddy-config:
  cert-sync-state:

networks:
  todesk-internal:
    driver: bridge

  shared-services:
    external: true
    name: ${SHARED_SERVICES_NETWORK:-shared-services}
