name: Windows Desktop

on:
  push:
    branches: ['codex/desktop-tauri']
  workflow_dispatch:
    inputs:
      server_url:
        description: '已部署服务地址，例如 https://www.example.com（不含 /api）'
        required: true
        type: string
  pull_request:
    paths:
      - 'client-vue/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      VITE_API_BASE_URL: ${{ inputs.server_url || vars.DESKTOP_SERVER_URL || 'https://www.sycsq.top' }}
      VITE_SOCKET_URL: ${{ inputs.server_url || vars.DESKTOP_SERVER_URL || 'https://www.sycsq.top' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-vue/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter client-vue test
      - run: cargo check --manifest-path client-vue/src-tauri/Cargo.toml
      - run: pnpm desktop:build
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ToDesk-Windows-x64
          path: client-vue/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
