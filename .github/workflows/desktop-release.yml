name: Desktop Release

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/desktop-release.test.mjs
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/desktop-release.mjs "$RELEASE_TAG"

  build:
    needs: validate
    uses: ./.github/workflows/desktop.yml

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ToDesk-*
          path: artifacts
          merge-multiple: true
      - name: Verify installers and create checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -name '*.dmg' | wc -l)" -eq 2
          cd release-assets
          sha256sum -- *.exe *.dmg > SHA256SUMS.txt
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## 安装包
          - Windows x64：下载 `.exe` 安装程序。
          - Apple 芯片 Mac：下载文件名含 `aarch64` 的 `.dmg`。
          - Intel Mac：下载文件名含 `x64` 的 `.dmg`。
          - macOS：打开 DMG，将 ToDesk 拖入 Applications。

          当前 Windows 安装包未签名，macOS 使用临时签名、未经过 Apple 公证，首次打开可能被系统拦截。
          安装包连接构建时配置的在线服务；本次发布不包含应用内自动更新。
          可使用 SHA256SUMS.txt 校验下载文件。
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft) throw Error("该版本已发布，请使用新版本号")'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "ToDesk Desktop v${RELEASE_VERSION}" \
              --notes-file release-notes.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
